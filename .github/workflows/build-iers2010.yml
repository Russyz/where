name: Build IERS2010 Windows DLL

on:
  push:
    branches:
      - codex/iers2010-dll
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out build scripts
        uses: actions/checkout@v4

      - name: Check out upstream Where source
        uses: actions/checkout@v4
        with:
          repository: kartverket/where
          ref: master
          path: where
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download IERS Fortran sources
        run: python scripts/fetch_iers.py where

      - name: Set up MinGW Fortran compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-binutils
            patch

      - name: Compile iers2010.dll
        shell: msys2 {0}
        run: bash scripts/build-iers2010.sh where

      - name: Load DLL and run APG reference case
        run: python scripts/smoke_test.py dist/iers2010.dll

      - name: Upload Windows x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: iers2010-windows-x64
          path: dist/*
          if-no-files-found: error
